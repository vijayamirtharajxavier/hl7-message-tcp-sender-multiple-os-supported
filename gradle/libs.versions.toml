richtextfx = { module = "org.fxmisc.richtext:richtextfx", version.ref = "richtextfx" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
monocle = { module = "org.testfx:openjfx-monocle", version.ref = "monocle" }

[bundles]
hapi-structures = ["hapi-v21", "hapi-v22", "hapi-v23", "hapi-v231", "hapi-v24", "hapi-v25", "hapi-v251", "hapi-v26", "hapi-v27", "hapi-v28", "hapi-v281"]

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
spotbugs = { id = "com.github.spotbugs", version = "6.2.4" }
