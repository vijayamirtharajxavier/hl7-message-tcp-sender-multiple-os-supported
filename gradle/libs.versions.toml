[libraries]
hapi-base = { module = "ca.uhn.hapi:hapi-base", version.ref = "hapi" }
hapi-v21 = { module = "ca.uhn.hapi:hapi-structures-v21", version.ref = "hapi" }
hapi-v22 = { module = "ca.uhn.hapi:hapi-structures-v22", version.ref = "hapi" }
hapi-v23 = { module = "ca.uhn.hapi:hapi-structures-v23", version.ref = "hapi" }
hapi-v231 = { module = "ca.uhn.hapi:hapi-structures-v231", version.ref = "hapi" }
hapi-v24 = { module = "ca.uhn.hapi:hapi-structures-v24", version.ref = "hapi" }
hapi-v25 = { module = "ca.uhn.hapi:hapi-structures-v25", version.ref = "hapi" }
hapi-v251 = { module = "ca.uhn.hapi:hapi-structures-v251", version.ref = "hapi" }
hapi-v26 = { module = "ca.uhn.hapi:hapi-structures-v26", version.ref = "hapi" }
hapi-v27 = { module = "ca.uhn.hapi:hapi-structures-v27", version.ref = "hapi" }
hapi-v28 = { module = "ca.uhn.hapi:hapi-structures-v28", version.ref = "hapi" }
hapi-v281 = { module = "ca.uhn.hapi:hapi-structures-v281", version.ref = "hapi" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
java-keyring = { module = "com.github.javakeyring:java-keyring", version.ref = "javakeyring" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }
sqlite-jdbc = { module = "io.github.willena:sqlite-jdbc", version.ref = "sqlite" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
